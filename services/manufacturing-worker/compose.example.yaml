services:
  manufacturing-worker:
    build: .
    restart: unless-stopped
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - ./worker.config.json:/run/gongzao/worker.config.json:ro
      - ./private-profiles:/profiles:ro
      - worker-data:/data
volumes:
  worker-data:
