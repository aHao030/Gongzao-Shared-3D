name: gongzao-identity
services:
  database:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${GONGZAO_IDENTITY_DB_PASSWORD:?Set a private database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - identity-postgres:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8180:8080"
    env_file:
      - ../../data/identity/identity.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${GONGZAO_IDENTITY_DB_PASSWORD:?Set a private database password}
      KC_HOSTNAME: ${GONGZAO_IDENTITY_PUBLIC_ORIGIN:?Set the public HTTPS identity origin}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ../../data/identity/import:/opt/keycloak/data/import:ro
volumes:
  identity-postgres:
